name: Deploy Bicep Infrastructure

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Bicep & Preview Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Validate Dev Configuration
      - name: Validate Bicep (Dev)
        run: |
          az deployment sub validate \
            --location eastus \
            --template-file main.bicep \
            --parameters parameters/dev.bicepparam

      # Validate Prod Configuration
      - name: Validate Bicep (Prod)
        run: |
          az deployment sub validate \
            --location eastus \
            --template-file main.bicep \
            --parameters parameters/prod.bicepparam

      - name: Run PSRule for Azure Analysis
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: 'PSRule.Rules.Azure'
          inputType: repository
          outputFormat: Sarif
          outputPath: ps-rule-results.sarif
        continue-on-error: true

      - name: Upload PSRule Scan Results to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ps-rule-results.sarif
            

      # What-If Preview for Dev on PRs
      - name: Preview Changes (Dev What-If)
        if: github.event_name == 'pull_request'
        run: |
          az deployment sub what-if \
            --location eastus \
            --template-file main.bicep \
            --parameters parameters/dev.bicepparam

  deploy-dev:
    name: Deploy to Development
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Dev Infrastructure
        run: |
          az deployment sub create \
            --location eastus \
            --template-file main.bicep \
            --parameters .github/parameters/dev.bicepparam

  deploy-prod:
    name: Deploy to Production
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Prod Infrastructure
        run: |
          az deployment sub create \
            --location eastus \
            --template-file main.bicep \
            --parameters .github/parameters/prod.bicepparam

    

