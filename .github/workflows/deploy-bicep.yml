name: Deploy Bicep Infrastructure

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Bicep & Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep Syntax
        run: |
          az deployment sub validate \
            --location eastus \
            --template-file main.bicep

      # Static Security Analysis runs on all PRs and Pushes
      - name: Run PSRule for Azure Analysis
        uses: microsoft/ps-rule-action@v2.0.0
        with:
          modules: 'PSRule.Rules.Azure'
          baseline: 'Azure.GA_2023_03'
          outputFormat: Sarif
          outputPath: ps-rule-results.sarif
        continue-on-error: false

      # What-If preview only runs on Pull Requests
      - name: Preview Infrastructure Changes (What-If)
        if: github.event_name == 'pull_request'
        run: |
          az deployment sub what-if \
            --location eastus \
            --template-file main.bicep

  deploy:
    name: Deploy to Azure
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute Bicep Subscription Deployment
        run: |
          az deployment sub create \
            --location eastus \
            --template-file main.bicep