name: Deploy Bicep Infrastructure

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select Environment to Deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - dev
          - prod

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate Bicep & Preview Changes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Validate Dev Configuration
      - name: Validate Bicep (Dev)
        run: |
          az deployment sub validate \
            --location eastus \
            --template-file main.bicep \
            --parameters .github/parameters/dev.bicepparam

      # Validate Prod Configuration
      - name: Validate Bicep (Prod)
        run: |
          az deployment sub validate \
            --location eastus \
            --template-file main.bicep \
            --parameters .github/parameters/prod.bicepparam

      - name: Run PSRule for Azure Analysis
        uses: microsoft/ps-rule@v2.9.0
        continue-on-error: true
        with:
          modules: 'PSRule.Rules.Azure'
          inputType: repository
          outputFormat: Sarif
          outputPath: ps-rule-results.sarif
        

      - name: Upload PSRule Scan Results to Security Tab
        uses: github/codeql-action/upload-sarif@v3.28.11
        if: always()
        with:
          sarif_file: ps-rule-results.sarif
            

      # What-If Preview for Dev on PRs
      - name: Preview Changes (Dev What-If)
        if: github.event_name == 'pull_request'
        run: |
          az deployment sub what-if \
            --location eastus \
            --template-file main.bicep \
            --parameters .github/parameters/dev.bicepparam

  deploy-dev:
    name: Deploy to Development
    needs: validate
    if: ${{ github.event_name == 'push' || github.event.inputs.target_env == 'dev' || github.event.inputs.target_env == 'all' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Dev Infrastructure
        run: |
          az deployment sub create \
            --location eastus \
            --template-file main.bicep \
            --parameters .github/parameters/dev.bicepparam

  deploy-prod:
    name: Deploy to Production
    needs: validate
    if: ${{ github.event_name == 'push' || github.event.inputs.target_env == 'prod' || github.event.inputs.target_env == 'all' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Prod Infrastructure
        run: |
          az deployment sub create \
            --location eastus \
            --template-file main.bicep \
            --parameters .github/parameters/prod.bicepparam

    

