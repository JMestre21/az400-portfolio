name: Deploy Bicep Infrastructure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select Environment to Deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write          # Required for Azure OIDC authentication
  contents: read           # Required to check out repository code
  security-events: write   # Required to upload SARIF reports to GitHub Security tab

jobs:
 # ====================================================================
  # JOB 1: DEVSECOPS SECURITY & COMPLIANCE SCANNING (DOMAIN 2)
  # ====================================================================
  security-and-compliance:
    name: DevSecOps Compliance & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # 1. Dependency Review Gate (Runs ONLY on Pull Requests)
      - name: Dependency Review Gate
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: 'high'
        continue-on-error: true

      # 2. Create Reports Directory for SARIF Outputs
      - name: Create Reports Directory
        run: mkdir -p reports

      # 3. PSRule Analysis (Outputs directly into created reports/ directory)
      - name: Run PSRule for Azure WAF Analysis
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: 'PSRule.Rules.Azure'
          outputFormat: Sarif
          outputPath: reports/ps-rule-results.sarif
        continue-on-error: true

      # 4. Checkov Static IaC Security Analysis
      - name: Run Checkov Static Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          output_format: sarif
          output_file_path: reports/checkov-results.sarif
          soft_fail: true

      # 5. Upload PSRule Results to Security Tab
      - name: Upload PSRule Results to Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/ps-rule-results.sarif
          category: ps-rule

      # 6. Upload Checkov Results to Security Tab
      - name: Upload Checkov Results to Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/checkov-results.sarif
          category: checkov
          
  # ====================================================================
  # JOB 2: VALIDATION & WHAT-IF PREVIEW
  # ====================================================================
  validate:
    name: Validate Bicep & Preview Changes
    needs: security-and-compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep Syntax Validation
        run: az bicep build --file main.bicep

      - name: Preview Changes (Dev What-If)
        if: github.event_name == 'pull_request'
        run: |
          az deployment sub what-if \
            --location eastus \
            --template-file main.bicep \
            --parameters .github/parameters/dev.bicepparam

  # ====================================================================
  # JOB 3: DEPLOYMENT TO DEV ENVIRONMENT
  # ====================================================================
  deploy-dev:
    name: Deploy to Dev Environment
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.target_env == 'dev')
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Dev Infrastructure
        run: |
          az deployment sub create \
            --name "dev-deploy-${{ github.run_id }}" \
            --location eastus \
            --template-file main.bicep \
            --parameters .github/parameters/dev.bicepparam

  # ====================================================================
  # JOB 4: DEPLOYMENT TO PRODUCTION ENVIRONMENT
  # ====================================================================
  deploy-prod:
    name: Deploy to Production Environment
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.target_env == 'prod')
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Prod Infrastructure
        run: |
          az deployment sub create \
            --name "prod-deploy-${{ github.run_id }}" \
            --location eastus \
            --template-file main.bicep \
            --parameters .github/parameters/prod.bicepparam