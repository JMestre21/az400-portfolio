version: 2
updates:
  # ====================================================================
  # 1. GITHUB ACTIONS WORKFLOW DEPENDENCIES
  # Monitors third-party actions (e.g., azure/login, microsoft/ps-rule)
  # ====================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "JMestre21"
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    # Group minor and patch updates into a single PR to reduce noise
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ====================================================================
  # 2. APPLICATION DEPENDENCIES (e.g., .NET / NuGet)
  # Change to "npm", "pip", or "docker" depending on your app runtime
  # ====================================================================
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "nuget"
    # Automated security patch prioritization
    allow:
      - dependency-type: "direct"

  # ====================================================================
  # 3. DOCKER / CONTAINER REGISTRY DEPENDENCIES (Optional)
  # Monitors base images if you deploy containerized workloads to Azure
  # ====================================================================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"